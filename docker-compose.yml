services:
  db:
    image: postgres:15-alpine
    container_name: sentinelfi-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: sentinelfi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sentinelfi-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinelfi-backend
    env_file: .env.prod
    environment:
      # Per-service listen port (single shared env_file can't hold three different ports).
      PORT: "3001"
    ports:
      - "3001:3001"
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/backend/src
        - action: sync
          path: ./shared
          target: /app/shared
        - action: rebuild
          path: ./backend/package.json
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:3001
        # NEXT_PUBLIC_* are inlined at build time; override via shell env if needed.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
        NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${NEXT_PUBLIC_ADSENSE_CLIENT_ID:-}
        NEXT_PUBLIC_ADSENSE_BANNER_SLOT: ${NEXT_PUBLIC_ADSENSE_BANNER_SLOT:-}
        FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    container_name: sentinelfi-frontend
    env_file: .env.prod
    environment:
      # Per-service listen port (single shared env_file can't hold three different ports).
      PORT: "3000"
      # Explicitly set the internal rewrite target for Next.js
      BACKEND_INTERNAL_URL: http://backend:3001
    ports:
      - "3000:3000"

    develop:
      watch:
        - action: sync
          path: ./frontend/components
          target: /app/frontend/components
        - action: sync
          path: ./frontend/pages
          target: /app/frontend/pages
        - action: sync
          path: ./shared
          target: /app/shared
        - action: rebuild
          path: ./frontend/package.json
    depends_on:
      - backend

  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: sentinelfi-ai-agent
    env_file: .env.prod
    environment:
      # Per-service listen port (single shared env_file can't hold three different ports).
      PORT: "8000"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
