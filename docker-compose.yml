version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sentinelfi-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: sentinelfi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sentinelfi-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinelfi-backend
    env_file: .env.prod
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sentinelfi-frontend
    env_file: .env.prod
    environment:
      # Explicitly set the internal rewrite target for Next.js
      BACKEND_INTERNAL_URL: http://backend:3000
    ports:
      - "3001:3001"
    depends_on:
      - backend

  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: sentinelfi-ai-agent
    env_file: .env.prod
    ports:
      - "8000:8000"

volumes:
  postgres_data:
