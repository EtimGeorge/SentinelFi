version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sentinelfi-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: sentinelfi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sentinelfi-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinelfi-backend
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-root}@db:5432/sentinelfi?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sentinelfi-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3000
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - backend

  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: sentinelfi-ai-agent
    environment:
      PORT: 8000
    ports:
      - "8000:8000"

volumes:
  postgres_data:
