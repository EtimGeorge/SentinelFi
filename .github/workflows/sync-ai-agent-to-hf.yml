name: Sync AI Agent to Hugging Face Space

on:
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push ai-agent to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
        # Replace HF_USERNAME with your actual Hugging          Face username
          # Replace sentinelfi-ai with your actual Space name
          cd ai-agent
          git init
          # Explicitly set user config for the commit to prevent Git errors
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote add space https://Saencrystal:$HF_TOKEN@huggingface.co/spaces/Saencrystal/sentinelfi_ai
          git add -A
          git commit -m "Sync from GitHub: ${{ github.sha }}"
          git push space HEAD:main --force

