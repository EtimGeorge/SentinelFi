name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (frontend + backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package (produces types consumed by frontend/backend)
        run: npm run build -w shared

      - name: Typecheck frontend
        run: npm run typecheck -w frontend

      - name: Typecheck backend
        run: npm run typecheck -w backend

  lint:
    name: Lint (incl. sentinelfi design guardrail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint -w frontend

      - name: Lint backend
        run: npm run lint -w backend

  tests:
    name: Jest (frontend + backend, CI mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w shared

      - name: Test frontend (non-watch CI mode)
        run: npm run test:ci -w frontend

      - name: Test backend
        run: npm run test:ci -w backend

  migrations-rehearsal:
    name: Migration rehearsal (public + tenant up/down)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinelfi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentinelfi_ci?sslmode=disable
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentinelfi_ci?sslmode=disable
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build shared package
        run: npm run build -w shared
      - name: Public migrations — up (full)
        working-directory: backend
        run: npx --no-install ts-node -r reflect-metadata -r tsconfig-paths/register --project tsconfig.typeorm.json ../node_modules/typeorm/cli.js -d ormconfig.public.ts migration:run
      - name: Public migrations — down (full loop)
        working-directory: backend
        shell: bash
        run: |
          for i in $(seq 1 300); do
            out=$(npx --no-install ts-node -r reflect-metadata -r tsconfig-paths/register --project tsconfig.typeorm.json ../node_modules/typeorm/cli.js -d ormconfig.public.ts migration:revert 2>&1) && status=0 || status=$?
            echo "$out"
            if [ "$status" -ne 0 ]; then
              if echo "$out" | grep -qi "no migrations"; then break; fi
              echo "::error::public migration revert failed"; exit 1
            fi
          done
      - name: Prepare tenant schema (ormconfig.tenant.ts targets solution_energy)
        run: psql "$DATABASE_URL" -c 'CREATE SCHEMA IF NOT EXISTS solution_energy;'
      - name: Tenant migrations — up (full)
        working-directory: backend
        run: npx --no-install ts-node -r reflect-metadata -r tsconfig-paths/register --project tsconfig.typeorm.json ../node_modules/typeorm/cli.js -d ormconfig.tenant.ts migration:run
      - name: Tenant migrations — down (full loop)
        working-directory: backend
        shell: bash
        run: |
          for i in $(seq 1 300); do
            out=$(npx --no-install ts-node -r reflect-metadata -r tsconfig-paths/register --project tsconfig.typeorm.json ../node_modules/typeorm/cli.js -d ormconfig.tenant.ts migration:revert 2>&1) && status=0 || status=$?
            echo "$out"
            if [ "$status" -ne 0 ]; then
              if echo "$out" | grep -qi "no migrations"; then break; fi
              echo "::error::tenant migration revert failed"; exit 1
            fi
          done